name: 'Generate protocol index'
description: 'Generate the PROTOCOLS.yaml federation index from the protocols in a repository.'

inputs:
  protocols-path:
    description: 'Directory holding the protocols, relative to the repository root.'
    required: false
    default: 'protocols'
  output:
    description: 'Path to write the generated index to.'
    required: false
    default: 'PROTOCOLS.yaml'
  commit:
    description: 'Commit and push the generated index if it changed. Requires contents: write.'
    required: false
    default: 'true'
  commit-message:
    description: 'Commit message used when the index changes.'
    required: false
    default: 'chore: Update PROTOCOLS.yaml [skip ci]'
  committer-name:
    description: >-
      Name recorded as the commit author. Defaults to github-actions[bot]; pass the identity of
      whatever credential actually pushes, so the commit and the push agree about who made it.
    required: false
    default: 'github-actions[bot]'
  committer-email:
    description: >-
      Email recorded as the commit author. For a GitHub App this is
      <bot-user-id>+<app-slug>[bot]@users.noreply.github.com, where bot-user-id is the id of the
      App's bot USER account — `gh api /users/<app-slug>[bot] --jq .id` — and NOT the App
      registration id. Using the registration id still pushes, but GitHub silently declines to
      associate the commit with the bot.
    required: false
    default: 'github-actions[bot]@users.noreply.github.com'
  python-version:
    description: 'Python version to install.'
    required: false
    default: '3.11'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: pip install pyyaml 'pydantic>=2.0.0'

    - name: Generate index
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/../../scripts/generate_protocols_yaml.py" \
          "${{ inputs.protocols-path }}" "${{ inputs.output }}"

    # Pushes over whatever credential the caller's checkout configured. Where `main` is protected,
    # the caller mints a GitHub App installation token and passes it to actions/checkout via its
    # `token` input; GITHUB_TOKEN cannot push past a ruleset that requires pull requests, and
    # GitHub Actions itself cannot be granted a ruleset bypass.
    #
    # Loop protection is the CALLER'S responsibility, not this action's. A push authenticated by
    # anything other than GITHUB_TOKEN does trigger workflows, so a caller that re-runs on its own
    # index commit will loop. The template guards this twice — the commit touches only the index,
    # which sits outside its `paths:` filter, and the default commit-message carries [skip ci] — but
    # a caller with neither, or with a custom commit-message, must supply an equivalent guard.
    - name: Commit and push changes
      if: inputs.commit == 'true'
      shell: bash
      run: |
        git config --local user.name "${{ inputs.committer-name }}"
        git config --local user.email "${{ inputs.committer-email }}"
        git add "${{ inputs.output }}"
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "${{ inputs.commit-message }}"
        git push
