name: 'Validate protocols'
description: 'Check every protocol.md in a repository against the AI agent protocol standard.'

inputs:
  protocols-path:
    description: 'Directory holding the protocols, relative to the repository root.'
    required: false
    default: 'protocols'
  python-version:
    description: 'Python version to install.'
    required: false
    default: '3.11'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: pip install 'pydantic>=2.0.0' pyyaml

    - name: Validate protocols
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../scripts/validate_protocol.py" "${{ inputs.protocols-path }}"
