name: Generate Protocol Index

on:
  # Tracking the generator at @main means the next run uses it — but a generator change upstream
  # raises no event here, so nothing regenerates until a local change does. Run this by hand after
  # a generator change you care about, or add a `schedule:` if you would rather it reconcile itself.
  workflow_dispatch:
  push:
    branches: [main]
    # The index is a function of the protocols *and* of the generator, so a change to this
    # workflow must regenerate it too.
    paths:
      - 'protocols/**'
      - '.github/workflows/generate-index.yml'

# Needed only for the GITHUB_TOKEN fallback below, where `main` is unprotected and no App is
# configured. If you set the App up, reduce this to `contents: read`: the push then uses the
# installation token, and leaving write here would hand every step a second write-capable
# credential for nothing.
permissions:
  contents: write

# Two merges in quick succession would otherwise run concurrently, and the second push would be
# rejected as non-fast-forward: its checkout predates the first run's index commit. Queue rather
# than cancel — a cancelled run leaves the index describing the previous commit.
concurrency:
  group: generate-index
  cancel-in-progress: false

jobs:
  generate-index:
    runs-on: ubuntu-latest
    # Hold the App credentials in an environment whose deployment branch policy allows only `main`.
    # A pull request from a branch in the same repository can otherwise read them — same-repo PRs do
    # receive secrets — and they mint a token that bypasses branch protection. Delete this line if
    # `main` is not protected and you kept them as plain repository secrets.
    environment: index-generation
    env:
      INDEX_APP_ID: ${{ secrets.INDEX_APP_ID }}
    steps:
      # Where `main` is protected, the index has to be pushed by something that can bypass the
      # ruleset. GITHUB_TOKEN cannot: a ruleset requiring pull requests blocks github-actions[bot],
      # and GitHub Actions itself cannot be granted a bypass, because bypass actors of type
      # Integration must be GitHub Apps installed on the organisation and Actions is not one. A
      # purpose-built App is. Give it `contents: write` and nothing else, install it on this
      # repository only, and add it as a bypass actor on the ruleset; its token expires after an hour.
      #
      # Skipped entirely when no App is configured, so a repository with an unprotected `main` can
      # adopt this template unchanged and fall back to GITHUB_TOKEN. `secrets` is not available to a
      # step `if:`, which is why the job maps it to `env` above.
      - uses: actions/create-github-app-token@v1
        id: app-token
        if: env.INDEX_APP_ID != ''
        with:
          app-id: ${{ secrets.INDEX_APP_ID }}
          private-key: ${{ secrets.INDEX_APP_PRIVATE_KEY }}
          # Request the scope explicitly rather than inheriting every permission the installation
          # happens to hold, so granting the App something else later cannot silently widen this.
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          # The branch tip, not the event SHA. Serialising runs is not enough on its own: a queued
          # run would still check out the commit that triggered it, and push a non-fast-forward once
          # `main` had moved. It also means the index describes `main` as it is, not as it was.
          ref: main
      # The email prefix below is the bot's user id, which is NOT the App registration id held in
      # INDEX_APP_ID. Getting it wrong still pushes, but GitHub does not link the commit to the bot.
      - name: Resolve the App's bot user id
        id: bot
        if: steps.app-token.outputs.app-slug != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          # Assigned separately, not interpolated into echo: `echo "id=$(gh api ...)"` exits 0 even
          # when the lookup fails, writing an empty id, and attribution then falls back silently.
          set -euo pipefail
          id="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          [ -n "$id" ] || { echo "::error::could not resolve the bot user id for ${SLUG}[bot]"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Deliberately @main rather than a release tag. A generator that has fallen behind produces an
      # index that disagrees with the standard it claims to follow, and does so silently — CI stays
      # green while running the wrong code. Tracking `main` means a breaking change reaches you
      # loudly instead, which is the trade this project wants while the spec is 0.y.z.
      - uses: waldronlab/agent-protocol-standard/actions/generate-index@main
        with:
          # Attribute the commit to whatever pushed it. Falls back to github-actions[bot] when the
          # App is not configured and GITHUB_TOKEN did the push.
          committer-name: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || 'github-actions[bot]' }}
          committer-email: ${{ steps.bot.outputs.id && format('{0}+{1}[bot]@users.noreply.github.com', steps.bot.outputs.id, steps.app-token.outputs.app-slug) || 'github-actions[bot]@users.noreply.github.com' }}
