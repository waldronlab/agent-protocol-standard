name: Generate Protocol Index

on:
  push:
    branches: [main]
    # The index is a function of the protocols *and* of the generator version pinned below, so a
    # change to this workflow must regenerate it too.
    paths:
      - 'protocols/**'
      - '.github/workflows/generate-index.yml'

# Needed only for the GITHUB_TOKEN fallback below, where `main` is unprotected and no App is
# configured. If you set the App up, reduce this to `contents: read`: the push then uses the
# installation token, and leaving write here would hand every step a second write-capable
# credential for nothing.
permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    # Hold the App credentials in an environment whose deployment branch policy allows only `main`.
    # A pull request from a branch in the same repository can otherwise read them — same-repo PRs do
    # receive secrets — and they mint a token that bypasses branch protection. Delete this line if
    # `main` is not protected and you kept them as plain repository secrets.
    environment: index-generation
    env:
      INDEX_APP_ID: ${{ secrets.INDEX_APP_ID }}
    steps:
      # Where `main` is protected, the index has to be pushed by something that can bypass the
      # ruleset. GITHUB_TOKEN cannot: a ruleset requiring pull requests blocks github-actions[bot],
      # and GitHub Actions itself cannot be granted a bypass, because bypass actors of type
      # Integration must be GitHub Apps installed on the organisation and Actions is not one. A
      # purpose-built App is. Give it `contents: write` and nothing else, install it on this
      # repository only, and add it as a bypass actor on the ruleset; its token expires after an hour.
      #
      # Skipped entirely when no App is configured, so a repository with an unprotected `main` can
      # adopt this template unchanged and fall back to GITHUB_TOKEN. `secrets` is not available to a
      # step `if:`, which is why the job maps it to `env` above.
      - uses: actions/create-github-app-token@v1
        id: app-token
        if: env.INDEX_APP_ID != ''
        with:
          app-id: ${{ secrets.INDEX_APP_ID }}
          private-key: ${{ secrets.INDEX_APP_PRIVATE_KEY }}
          # Request the scope explicitly rather than inheriting every permission the installation
          # happens to hold, so granting the App something else later cannot silently widen this.
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
      # @v0 is a moving tag, so this repository tracks the standard without a PR per release —
      # which is the point: an index generated by a stale generator is an index that disagrees with
      # the standard it claims to follow. To hold a fixed version, pin the release tag @v0.3.1 and
      # update it by hand — or, since a git tag can itself be retargeted, pin a commit SHA, which is
      # the only genuinely immutable reference.
      - uses: waldronlab/agent-protocol-standard/actions/generate-index@v0
        with:
          # Attribute the commit to whatever pushed it. Falls back to github-actions[bot] when the
          # App is not configured and GITHUB_TOKEN did the push.
          committer-name: ${{ steps.app-token.outputs.app-slug && format('{0}[bot]', steps.app-token.outputs.app-slug) || 'github-actions[bot]' }}
          committer-email: ${{ steps.app-token.outputs.app-slug && format('{0}+{1}[bot]@users.noreply.github.com', secrets.INDEX_APP_ID, steps.app-token.outputs.app-slug) || 'github-actions[bot]@users.noreply.github.com' }}
