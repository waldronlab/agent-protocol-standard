name: Generate Protocol Index

on:
  push:
    branches: [main]
    # The index is a function of the protocols *and* of the generator version pinned below, so a
    # change to this workflow must regenerate it too.
    paths:
      - 'protocols/**'
      - '.github/workflows/generate-index.yml'

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      # The index is pushed back to a protected branch, so the checkout authenticates with a
      # write-scoped deploy key rather than GITHUB_TOKEN: a ruleset requiring pull requests blocks
      # github-actions[bot], and Actions cannot be granted a bypass (bypass actors of type
      # Integration must be GitHub Apps installed on the organisation, and Actions is not one).
      # Add the public key under Settings -> Deploy keys with write access, the private key as this
      # secret, and DeployKey as a bypass actor on the ruleset.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.INDEX_DEPLOY_KEY }}
      # @v0 is a moving tag, so this repository tracks the standard without a PR per release —
      # which is the point: an index generated by a stale generator is an index that disagrees with
      # the standard it claims to follow. To hold a fixed version, pin the release tag @v0.3.1 and
      # update it by hand — or, since a git tag can itself be retargeted, pin a commit SHA, which is
      # the only genuinely immutable reference.
      - uses: waldronlab/agent-protocol-standard/actions/generate-index@v0
