name: Validate Protocols

# No paths filter, so "CI validates every protocol on every pull request" is simply true. Add one
# back if your repository grows large enough for the Actions minutes to matter.
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deliberately @main rather than a release tag: validating against a snapshot of the standard
      # means conforming to a version of it nobody publishes any more, and the failure is silent —
      # a green check produced by a validator older than the rule it claims to enforce.
      - uses: waldronlab/agent-protocol-standard/actions/validate-protocols@main
