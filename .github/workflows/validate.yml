name: Tooling

on:
  pull_request:

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/validate-protocols
        with:
          protocols-path: tests/fixtures/valid/basic/protocols

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pydantic pyyaml pytest

      - name: Run validator test suite
        run: pytest tests/
